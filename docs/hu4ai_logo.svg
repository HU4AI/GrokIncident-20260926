<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients and reusable components -->
  <defs>
    <!-- Dark Blue Gradient -->
    <linearGradient id="darkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="100%" stop-color="#203A43" />
    </linearGradient>
    
    <!-- Dark Red to Dark Orange Gradient -->
    <linearGradient id="warmTech" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#CC4E00" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#D2691E" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist White Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Main Logo Emblem Wrapper -->
  <g transform="translate(0, -10)">
    
    <!-- Outer Decorative Tech Bracket/Arch - Left Side -->
    <path d="M 120 130 C 90 160, 90 260, 120 290" fill="none" stroke="url(#warmTech)" stroke-width="6" stroke-linecap="round" />
    <circle cx="120" cy="130" r="5" fill="#8B0000" />
    <circle cx="120" cy="290" r="5" fill="#CC4E00" />

    <!-- Outer Decorative Tech Bracket/Arch - Right Side -->
    <path d="M 380 130 C 410 160, 410 260, 380 290" fill="none" stroke="url(#darkBlue)" stroke-width="6" stroke-linecap="round" />
    <circle cx="380" cy="130" r="5" fill="#0F2027" />
    <circle cx="380" cy="290" r="5" fill="#203A43" />

    <!-- Stylized Monogram "H" & "U" Interwoven Fusion -->
    <!-- Left Pillar of H -->
    <path d="M 170 120 L 170 280" fill="none" stroke="url(#darkBlue)" stroke-width="16" stroke-linecap="round" />
    <!-- Serif Tops and Bottoms for Classic Look -->
    <path d="M 150 120 L 190 120" fill="none" stroke="url(#darkBlue)" stroke-width="8" stroke-linecap="round" />
    <path d="M 150 280 L 190 280" fill="none" stroke="url(#darkBlue)" stroke-width="8" stroke-linecap="round" />

    <!-- Right Pillar / J-U Loop Side of H -->
    <path d="M 330 120 L 330 250 C 330 290, 290 310, 250 310 C 210 310, 190 290, 190 270" fill="none" stroke="url(#warmTech)" stroke-width="16" stroke-linecap="round" />
    <path d="M 310 120 L 350 120" fill="none" stroke="url(#warmTech)" stroke-width="8" stroke-linecap="round" />

    <!-- Center Crossbar fusing them with Circuit Node Aesthetic -->
    <path d="M 170 200 L 330 200" fill="none" stroke="url(#darkBlue)" stroke-width="12" />

    <!-- Core Central Circular Brain/AI Node Grid Overlay -->
    <circle cx="250" cy="200" r="45" fill="#FFFFFF" stroke="url(#darkBlue)" stroke-width="6" />
    <circle cx="250" cy="200" r="35" fill="none" stroke="url(#warmTech)" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Inner Circuit Connections inside Central Node -->
    <circle cx="250" cy="200" r="8" fill="url(#accentOrange)" />
    
    <!-- Circuit Pathways spreading outward from center -->
    <path d="M 250 155 L 250 175" fill="none" stroke="url(#darkBlue)" stroke-width="4" />
    <circle cx="250" cy="155" r="4" fill="#8B0000" />

    <path d="M 250 225 L 250 245" fill="none" stroke="url(#darkBlue)" stroke-width="4" />
    <circle cx="250" cy="245" r="4" fill="#203A43" />

    <path d="M 215 200 L 185 200" fill="none" stroke="url(#warmTech)" stroke-width="4" />
    <circle cx="185" cy="200" r="5" fill="#CC4E00" />

    <path d="M 285 200 L 315 200" fill="none" stroke="url(#darkBlue)" stroke-width="4" />
    <circle cx="315" cy="200" r="5" fill="#0F2027" />

    <!-- Diagonal Micro-circuits representing Human & AI connection -->
    <path d="M 222 172 L 200 150" fill="none" stroke="url(#darkBlue)" stroke-width="3" />
    <circle cx="200" cy="150" r="4" fill="#0F2027" />

    <path d="M 278 172 L 300 150" fill="none" stroke="url(#warmTech)" stroke-width="3" />
    <circle cx="300" cy="150" r="4" fill="#FF4500" />
    
    <path d="M 222 228 L 200 250" fill="none" stroke="url(#warmTech)" stroke-width="3" />
    <circle cx="200" cy="250" r="4" fill="#CC4E00" />

    <path d="M 278 228 L 300 250" fill="none" stroke="url(#darkBlue)" stroke-width="3" />
    <circle cx="300" cy="250" r="4" fill="#203A43" />
  </g>

  <!-- Typography: HU4AI Brand Name -->
  <text x="250" y="420" font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" fill="#0F2027" text-anchor="middle" letter-spacing="4">HU4AI</text>
  
  <!-- Subtle clean subline text -->
  <text x="250" y="455" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#CC4E00" text-anchor="middle" letter-spacing="8">HUMAN FOR AI</text>
</svg>
